<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nova Strike - Retro Space Shooter</title>
    <meta name="description" content="A retro 2D arcade space shooter with glowing vector graphics, alien waves, boss battles, synth audio, and particle explosions." />
    <meta property="og:title" content="Nova Strike - Retro Space Shooter" />
    <meta property="og:description" content="A retro 2D arcade space shooter with glowing vector graphics, alien waves, boss battles, synth audio, and particle explosions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030712;
        font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
        color: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 900px;
        max-height: 1000px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas#gameCanvas {
        display: block;
        background: #02040a;
        box-shadow: 0 0 35px rgba(0, 240, 255, 0.25), 0 0 80px rgba(0, 0, 0, 0.9);
        border: 2px solid rgba(0, 240, 255, 0.3);
        border-radius: 6px;
        cursor: crosshair;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }
      /* CRT scanline overlay */
      .scanlines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0, 0, 0, 0.28) 50%,
          rgba(0, 0, 0, 0.28)
        );
        background-size: 100% 4px;
        z-index: 10;
        opacity: 0.7;
        border-radius: 6px;
      }
      .vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 65%, rgba(1, 3, 10, 0.75) 100%);
        z-index: 11;
        border-radius: 6px;
      }
      /* Mobile / On-screen controls */
      #mobile-controls {
        position: absolute;
        bottom: 16px;
        left: 0;
        width: 100%;
        padding: 0 20px;
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        pointer-events: none;
        z-index: 20;
      }
      .control-btn {
        pointer-events: auto;
        background: rgba(15, 23, 42, 0.75);
        border: 2px solid rgba(0, 240, 255, 0.6);
        color: #00f0ff;
        font-family: inherit;
        font-size: 16px;
        font-weight: bold;
        padding: 14px 22px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        backdrop-filter: blur(4px);
        transition: transform 0.1s, background-color 0.1s;
      }
      .control-btn:active {
        background: rgba(0, 240, 255, 0.3);
        transform: scale(0.95);
      }
      /* Top utility bar */
      #top-bar {
        position: absolute;
        top: 12px;
        right: 16px;
        display: flex;
        gap: 10px;
        z-index: 30;
      }
      .icon-btn {
        background: rgba(10, 15, 30, 0.65);
        border: 1px solid rgba(0, 240, 255, 0.4);
        color: #00f0ff;
        font-family: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        backdrop-filter: blur(4px);
      }
      .icon-btn:hover {
        background: rgba(0, 240, 255, 0.2);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="top-bar">
        <button id="audio-toggle" class="icon-btn" title="Toggle Sound">AUDIO: ON</button>
        <button id="pause-btn" class="icon-btn" title="Pause Game">PAUSE (P)</button>
      </div>

      <canvas id="gameCanvas" width="800" height="950"></canvas>
      <div class="scanlines"></div>
      <div class="vignette"></div>

      <div id="mobile-controls">
        <button id="mobile-bomb-btn" class="control-btn" style="border-color: #ffbe0b; color: #ffbe0b;">BOMB (B)</button>
        <button id="mobile-fire-btn" class="control-btn">FIRE (SPACE)</button>
      </div>
    </div>

    <script>
      /**
       * NOVA STRIKE - 2D Retro Space Shooter
       * Self-contained Pure HTML5 Canvas & Web Audio API
       */
      window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const audioBtn = document.getElementById('audio-toggle');
        const pauseBtn = document.getElementById('pause-btn');
        const mobileControls = document.getElementById('mobile-controls');
        const mobileFireBtn = document.getElementById('mobile-fire-btn');
        const mobileBombBtn = document.getElementById('mobile-bomb-btn');

        // Check if touch device
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        if (isTouchDevice) {
          mobileControls.style.display = 'flex';
        }

        // Logical game dimensions
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 950;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Auto-fit responsive scaling
        function resizeCanvas() {
          const wrapper = document.getElementById('game-wrapper');
          const maxWidth = wrapper.clientWidth;
          const maxHeight = wrapper.clientHeight;
          const scale = Math.min(maxWidth / CANVAS_WIDTH, maxHeight / CANVAS_HEIGHT);
          canvas.style.width = `${Math.floor(CANVAS_WIDTH * scale)}px`;
          canvas.style.height = `${Math.floor(CANVAS_HEIGHT * scale)}px`;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ==========================================
        // 1. PROCEDURAL RETRO AUDIO (WEB AUDIO API)
        // ==========================================
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              audioCtx = new AudioContext();
            }
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }

        audioBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          initAudio();
          soundEnabled = !soundEnabled;
          audioBtn.innerText = soundEnabled ? 'AUDIO: ON' : 'AUDIO: OFF';
          audioBtn.style.color = soundEnabled ? '#00f0ff' : '#9ca3af';
          audioBtn.style.borderColor = soundEnabled ? 'rgba(0, 240, 255, 0.4)' : '#4b5563';
        });

        const SFX = {
          playLaser(freq = 880, endFreq = 220, duration = 0.12, type = 'sawtooth') {
            if (!soundEnabled || !audioCtx) return;
            try {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = type;
              osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
              
              gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start();
              osc.stop(audioCtx.currentTime + duration);
            } catch (err) {}
          },

          playEnemyLaser() {
            this.playLaser(450, 120, 0.18, 'triangle');
          },

          playExplosion(intensity = 1) {
            if (!soundEnabled || !audioCtx) return;
            try {
              const bufferSize = Math.floor(audioCtx.sampleRate * (0.2 + intensity * 0.15));
              const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
              const data = buffer.getChannelData(0);
              for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
              }
              const noise = audioCtx.createBufferSource();
              noise.buffer = buffer;

              const filter = audioCtx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(800 * intensity, audioCtx.currentTime);
              filter.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.35 * intensity);

              const gain = audioCtx.createGain();
              gain.gain.setValueAtTime(0.35 * Math.min(1.5, intensity), audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35 * intensity);

              noise.connect(filter);
              filter.connect(gain);
              gain.connect(audioCtx.destination);
              noise.start();
            } catch (err) {}
          },

          playPowerup() {
            if (!soundEnabled || !audioCtx) return;
            try {
              const notes = [440, 554, 659, 880];
              notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.06);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.06 + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.06);
                osc.stop(audioCtx.currentTime + idx * 0.06 + 0.08);
              });
            } catch (err) {}
          },

          playShieldHit() {
            this.playLaser(1200, 300, 0.15, 'sine');
          },

          playBossWarning() {
            if (!soundEnabled || !audioCtx) return;
            try {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(150, audioCtx.currentTime);
              osc.frequency.linearRampToValueAtTime(320, audioCtx.currentTime + 0.25);
              osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.5);

              gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.5);
            } catch (err) {}
          },

          playBomb() {
            if (!soundEnabled || !audioCtx) return;
            this.playExplosion(2.5);
            this.playLaser(800, 60, 0.6, 'sine');
          }
        };

        // ==========================================
        // 2. GAME STATE & VARIABLES
        // ==========================================
        let gameState = 'TITLE'; // 'TITLE', 'PLAYING', 'PAUSED', 'GAMEOVER'
        let score = 0;
        let highScore = parseInt(localStorage.getItem('nova_strike_high_score') || '0', 10);
        let wave = 1;
        let lastTime = 0;
        let bossActive = false;
        let bossSpawnScore = 500;
        let screenShake = 0;
        let bossWarningTimer = 0;
        let statsEnemiesDefeated = 0;

        // Keys state
        const keys = {
          ArrowUp: false,
          ArrowDown: false,
          ArrowLeft: false,
          ArrowRight: false,
          w: false,
          s: false,
          a: false,
          d: false,
          Space: false,
          b: false,
          x: false
        };

        // Mouse / Pointer state
        const pointer = {
          x: CANVAS_WIDTH / 2,
          y: CANVAS_HEIGHT - 120,
          isDown: false,
          active: false
        };

        // ==========================================
        // 3. BACKGROUND STARFIELD & NEBULA
        // ==========================================
        class Starfield {
          constructor() {
            this.stars = [];
            const count = 120;
            for (let i = 0; i < count; i++) {
              this.stars.push({
                x: Math.random() * CANVAS_WIDTH,
                y: Math.random() * CANVAS_HEIGHT,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 2 + 0.4,
                brightness: Math.random() * 0.8 + 0.2,
                color: Math.random() > 0.8 ? '#00f0ff' : (Math.random() > 0.85 ? '#ff007f' : '#ffffff')
              });
            }
            this.nebulae = [
              { x: CANVAS_WIDTH * 0.2, y: 200, r: 250, color: 'rgba(0, 140, 255, 0.05)', vy: 0.15 },
              { x: CANVAS_WIDTH * 0.8, y: 650, r: 300, color: 'rgba(255, 0, 128, 0.04)', vy: 0.12 },
              { x: CANVAS_WIDTH * 0.5, y: 400, r: 200, color: 'rgba(80, 0, 200, 0.04)', vy: 0.2 }
            ];
          }

          update(dt) {
            // Speed up slightly during boss or high wave
            const speedMult = bossActive ? 1.4 : 1.0;
            for (let s of this.stars) {
              s.y += s.speed * speedMult * 60 * dt;
              if (s.y > CANVAS_HEIGHT) {
                s.y = 0;
                s.x = Math.random() * CANVAS_WIDTH;
              }
            }
            for (let n of this.nebulae) {
              n.y += n.vy * 60 * dt;
              if (n.y - n.r > CANVAS_HEIGHT) {
                n.y = -n.r;
                n.x = Math.random() * CANVAS_WIDTH;
              }
            }
          }

          draw(ctx) {
            // Draw faint nebula clouds
            for (let n of this.nebulae) {
              const grad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.r);
              grad.addColorStop(0, n.color);
              grad.addColorStop(1, 'transparent');
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
              ctx.fill();
            }

            // Draw stars with slight twinkle
            for (let s of this.stars) {
              ctx.fillStyle = s.color;
              ctx.globalAlpha = s.brightness * (0.7 + 0.3 * Math.sin(Date.now() * 0.003 + s.x));
              ctx.fillRect(s.x, s.y, s.size, s.size);
            }
            ctx.globalAlpha = 1.0;
          }
        }

        const starfield = new Starfield();

        // ==========================================
        // 4. PARTICLE SYSTEM
        // ==========================================
        class Particle {
          constructor(x, y, vx, vy, color, size, life, shape = 'circle') {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.color = color;
            this.size = size;
            this.maxLife = life;
            this.life = life;
            this.shape = shape;
          }

          update(dt) {
            this.x += this.vx * 60 * dt;
            this.y += this.vy * 60 * dt;
            this.vx *= 0.96;
            this.vy *= 0.96;
            this.life -= dt;
            return this.life > 0;
          }

          draw(ctx) {
            const alpha = Math.max(0, this.life / this.maxLife);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;

            if (this.shape === 'ring') {
              ctx.strokeStyle = this.color;
              ctx.lineWidth = 2;
              ctx.beginPath();
              const currentR = this.size * (1 + (1 - alpha) * 2.5);
              ctx.arc(this.x, this.y, currentR, 0, Math.PI * 2);
              ctx.stroke();
            } else if (this.shape === 'spark') {
              ctx.strokeStyle = this.color;
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(this.x, this.y);
              ctx.lineTo(this.x - this.vx * 2, this.y - this.vy * 2);
              ctx.stroke();
            } else {
              ctx.beginPath();
              ctx.arc(this.x, this.y, Math.max(0.5, this.size * alpha), 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }

        const particles = [];

        function createExplosion(x, y, color = '#ff007f', count = 28, scale = 1) {
          SFX.playExplosion(scale);
          screenShake = Math.max(screenShake, 5 * scale);

          // Shockwave ring
          particles.push(new Particle(x, y, 0, 0, color, 20 * scale, 0.4, 'ring'));

          // Core starburst sparks
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = (Math.random() * 5 + 2) * scale;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            const c = Math.random() > 0.4 ? color : (Math.random() > 0.5 ? '#ffbe0b' : '#ffffff');
            const size = (Math.random() * 3 + 1.5) * scale;
            const life = Math.random() * 0.4 + 0.3;
            particles.push(new Particle(x, y, vx, vy, c, size, life, Math.random() > 0.5 ? 'spark' : 'circle'));
          }
        }

        // Floating combat score texts
        class FloatingText {
          constructor(text, x, y, color = '#00f0ff') {
            this.text = text;
            this.x = x;
            this.y = y;
            this.color = color;
            this.life = 0.9;
            this.maxLife = 0.9;
            this.vy = -1.5;
          }

          update(dt) {
            this.y += this.vy * 60 * dt;
            this.life -= dt;
            return this.life > 0;
          }

          draw(ctx) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.textAlign = 'center';
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
          }
        }

        const floatingTexts = [];

        // ==========================================
        // 5. PROJECTILES & POWERUPS
        // ==========================================
        class Bullet {
          constructor(x, y, vx, vy, color, radius, isEnemy = false, damage = 1) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.color = color;
            this.radius = radius;
            this.isEnemy = isEnemy;
            this.damage = damage;
          }

          update(dt) {
            this.x += this.vx * 60 * dt;
            this.y += this.vy * 60 * dt;
            return (this.y >= -20 && this.y <= CANVAS_HEIGHT + 20 && this.x >= -20 && this.x <= CANVAS_WIDTH + 20);
          }

          draw(ctx) {
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;

            if (this.isEnemy) {
              // Glowing plasma orb
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.radius * 0.45, 0, Math.PI * 2);
              ctx.fill();
            } else {
              // Sleek laser bolt
              ctx.beginPath();
              ctx.roundRect(this.x - this.radius, this.y - this.radius * 2.5, this.radius * 2, this.radius * 5, 2);
              ctx.fill();
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.roundRect(this.x - this.radius * 0.4, this.y - this.radius * 2.2, this.radius * 0.8, this.radius * 4.4, 1);
              ctx.fill();
            }
            ctx.restore();
          }
        }

        const bullets = [];

        class PowerUp {
          constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type; // 'WEAPON', 'SHIELD', 'HEALTH', 'BOMB', 'RAPID'
            this.radius = 16;
            this.vy = 1.6;
            this.angle = 0;
            this.time = 0;

            const map = {
              WEAPON: { color: '#00f0ff', label: 'W' },
              SHIELD: { color: '#38bdf8', label: 'S' },
              HEALTH: { color: '#34d399', label: '+' },
              BOMB:   { color: '#f59e0b', label: 'B' },
              RAPID:  { color: '#ec4899', label: 'R' }
            };
            this.info = map[type] || map.WEAPON;
          }

          update(dt) {
            this.y += this.vy * 60 * dt;
            this.time += dt * 3;
            this.x += Math.sin(this.time) * 0.8;
            return this.y <= CANVAS_HEIGHT + 30;
          }

          draw(ctx) {
            ctx.save();
            ctx.shadowBlur = 14;
            ctx.shadowColor = this.info.color;

            // Rotating hexagon container
            ctx.strokeStyle = this.info.color;
            ctx.lineWidth = 2.5;
            ctx.fillStyle = 'rgba(10, 20, 35, 0.7)';
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const a = (i * Math.PI / 3) + this.time * 0.5;
              const px = this.x + Math.cos(a) * this.radius;
              const py = this.y + Math.sin(a) * this.radius;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Icon letter
            ctx.font = 'bold 15px "Courier New", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.info.label, this.x, this.y);

            ctx.restore();
          }
        }

        const powerUps = [];

        // ==========================================
        // 6. PLAYER SHIP CLASS
        // ==========================================
        class Player {
          constructor() {
            this.reset();
          }

          reset() {
            this.x = CANVAS_WIDTH / 2;
            this.y = CANVAS_HEIGHT - 130;
            this.vx = 0;
            this.vy = 0;
            this.speed = 7.5;
            this.radius = 22;
            this.lives = 3;
            this.maxHealth = 100;
            this.health = 100;
            this.shield = 0; // shield hit points
            this.maxShield = 50;
            this.bombs = 2;
            this.weaponLevel = 1; // 1, 2, 3
            this.rapidFireTimer = 0;
            this.fireCooldown = 0;
            this.baseFireInterval = 0.16; // seconds
            this.invincibleTimer = 0;
            this.thrusterAnim = 0;
          }

          shoot() {
            if (this.fireCooldown > 0) return;
            const interval = this.rapidFireTimer > 0 ? 0.08 : (this.baseFireInterval - (this.weaponLevel - 1) * 0.02);
            this.fireCooldown = interval;

            SFX.playLaser(920, 260, 0.1);

            const bulletSpeed = -13;
            const bulletDmg = this.rapidFireTimer > 0 ? 1.5 : 1;

            if (this.weaponLevel === 1) {
              bullets.push(new Bullet(this.x - 12, this.y - 15, 0, bulletSpeed, '#00f0ff', 3.5, false, bulletDmg));
              bullets.push(new Bullet(this.x + 12, this.y - 15, 0, bulletSpeed, '#00f0ff', 3.5, false, bulletDmg));
            } else if (this.weaponLevel === 2) {
              bullets.push(new Bullet(this.x, this.y - 24, 0, bulletSpeed, '#00f0ff', 4, false, bulletDmg));
              bullets.push(new Bullet(this.x - 16, this.y - 10, -1.8, bulletSpeed, '#38bdf8', 3.5, false, bulletDmg));
              bullets.push(new Bullet(this.x + 16, this.y - 10, 1.8, bulletSpeed, '#38bdf8', 3.5, false, bulletDmg));
            } else {
              // Level 3 Quad spread
              bullets.push(new Bullet(this.x - 8, this.y - 24, -0.6, bulletSpeed, '#00f0ff', 4, false, bulletDmg));
              bullets.push(new Bullet(this.x + 8, this.y - 24, 0.6, bulletSpeed, '#00f0ff', 4, false, bulletDmg));
              bullets.push(new Bullet(this.x - 22, this.y - 8, -2.8, bulletSpeed, '#a855f7', 3.5, false, bulletDmg));
              bullets.push(new Bullet(this.x + 22, this.y - 8, 2.8, bulletSpeed, '#a855f7', 3.5, false, bulletDmg));
            }
          }

          useBomb() {
            if (this.bombs <= 0) return false;
            this.bombs--;
            SFX.playBomb();
            screenShake = 18;

            // Clear all enemy bullets
            bullets.length = bullets.filter(b => !b.isEnemy).length;

            // Damage all active enemies heavily
            for (let e of enemies) {
              e.takeDamage(40);
            }
            if (boss) {
              boss.takeDamage(50);
            }

            // Mega shockwave particles
            for (let i = 0; i < 4; i++) {
              setTimeout(() => {
                particles.push(new Particle(CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 0, 0, '#ffbe0b', 80 * (i + 1), 0.6, 'ring'));
              }, i * 70);
            }
            floatingTexts.push(new FloatingText('NOVA DETONATION!', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, '#ffbe0b'));
            return true;
          }

          takeDamage(amount) {
            if (this.invincibleTimer > 0) return;

            if (this.shield > 0) {
              this.shield -= amount;
              SFX.playShieldHit();
              particles.push(new Particle(this.x, this.y, 0, 0, '#38bdf8', 35, 0.25, 'ring'));
              if (this.shield < 0) {
                this.health += this.shield; // remaining bleeds to health
                this.shield = 0;
              }
            } else {
              this.health -= amount;
              SFX.playExplosion(0.8);
              screenShake = 10;
              createExplosion(this.x, this.y, '#ef4444', 16, 0.8);
            }

            if (this.health <= 0) {
              this.lives--;
              createExplosion(this.x, this.y, '#00f0ff', 40, 1.8);
              if (this.lives > 0) {
                this.health = this.maxHealth;
                this.x = CANVAS_WIDTH / 2;
                this.y = CANVAS_HEIGHT - 130;
                this.invincibleTimer = 2.5;
                this.weaponLevel = Math.max(1, this.weaponLevel - 1);
                floatingTexts.push(new FloatingText('RESPAWN PROTECTED', this.x, this.y - 40, '#00f0ff'));
              } else {
                gameOver();
              }
            } else {
              this.invincibleTimer = 0.5; // brief iframe on hit
            }
          }

          update(dt) {
            // Timers
            if (this.fireCooldown > 0) this.fireCooldown -= dt;
            if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
            if (this.rapidFireTimer > 0) this.rapidFireTimer -= dt;

            // Thruster flame animation
            this.thrusterAnim += dt * 25;

            // Keyboard input calculation
            let moveX = 0;
            let moveY = 0;

            if (keys.ArrowLeft || keys.a) moveX -= 1;
            if (keys.ArrowRight || keys.d) moveX += 1;
            if (keys.ArrowUp || keys.w) moveY -= 1;
            if (keys.ArrowDown || keys.s) moveY += 1;

            if (moveX !== 0 && moveY !== 0) {
              moveX *= 0.7071;
              moveY *= 0.7071;
            }

            // Keyboard movement with smooth acceleration
            if (moveX !== 0 || moveY !== 0) {
              this.vx += moveX * this.speed * 45 * dt;
              this.vy += moveY * this.speed * 45 * dt;
              pointer.active = false;
            } else if (pointer.active) {
              // Mouse/touch follow
              const dx = pointer.x - this.x;
              const dy = pointer.y - this.y;
              this.vx = dx * 0.18;
              this.vy = dy * 0.18;
            }

            // Damping friction
            this.vx *= 0.88;
            this.vy *= 0.88;

            this.x += this.vx;
            this.y += this.vy;

            // Bounds restriction
            const pad = 28;
            if (this.x < pad) { this.x = pad; this.vx = 0; }
            if (this.x > CANVAS_WIDTH - pad) { this.x = CANVAS_WIDTH - pad; this.vx = 0; }
            if (this.y < pad + 30) { this.y = pad + 30; this.vy = 0; }
            if (this.y > CANVAS_HEIGHT - pad) { this.y = CANVAS_HEIGHT - pad; this.vy = 0; }

            // Automatic shooting if Space or Pointer is down
            if (keys.Space || pointer.isDown) {
              this.shoot();
            }

            // Engine trail particles
            if (Math.random() < 0.6) {
              const flameColor = this.rapidFireTimer > 0 ? '#ec4899' : (Math.random() > 0.4 ? '#00f0ff' : '#ffbe0b');
              particles.push(new Particle(
                this.x + (Math.random() * 8 - 4),
                this.y + 22,
                (Math.random() * 2 - 1) * 0.8,
                Math.random() * 3 + 3,
                flameColor,
                Math.random() * 3 + 1.5,
                0.25,
                'circle'
              ));
            }
          }

          draw(ctx) {
            // Invincibility flicker
            if (this.invincibleTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0) {
              return;
            }

            ctx.save();
            ctx.translate(this.x, this.y);

            // Ship tilt on horizontal movement
            const tilt = Math.max(-0.25, Math.min(0.25, this.vx * 0.03));
            ctx.rotate(tilt);

            // Thruster fire exhaust
            const flameLen = 14 + Math.sin(this.thrusterAnim) * 6;
            ctx.fillStyle = this.rapidFireTimer > 0 ? '#ec4899' : '#00f0ff';
            ctx.shadowBlur = 12;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.moveTo(-7, 18);
            ctx.lineTo(0, 18 + flameLen);
            ctx.lineTo(7, 18);
            ctx.closePath();
            ctx.fill();

            // Inner flame
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(-3, 18);
            ctx.lineTo(0, 18 + flameLen * 0.55);
            ctx.lineTo(3, 18);
            ctx.closePath();
            ctx.fill();

            // Procedural Player Spaceship Hull
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#00f0ff';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2.2;
            ctx.fillStyle = '#09152b';

            ctx.beginPath();
            // Nose tip
            ctx.moveTo(0, -26);
            // Right wing & cannon
            ctx.lineTo(12, -4);
            ctx.lineTo(24, 8);
            ctx.lineTo(26, 18);
            ctx.lineTo(18, 16);
            ctx.lineTo(8, 20);
            ctx.lineTo(0, 14);
            // Left wing
            ctx.lineTo(-8, 20);
            ctx.lineTo(-18, 16);
            ctx.lineTo(-26, 18);
            ctx.lineTo(-24, 8);
            ctx.lineTo(-12, -4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Wingtip glowing blasters
            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(-27, 4, 3, 12);
            ctx.fillRect(24, 4, 3, 12);

            // Cockpit Canopy
            ctx.fillStyle = '#38bdf8';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#38bdf8';
            ctx.beginPath();
            ctx.moveTo(0, -14);
            ctx.lineTo(5, 2);
            ctx.lineTo(0, 7);
            ctx.lineTo(-5, 2);
            ctx.closePath();
            ctx.fill();

            // Shield Bubble if active
            if (this.shield > 0) {
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = 2;
              ctx.shadowBlur = 16;
              ctx.shadowColor = '#38bdf8';
              ctx.globalAlpha = 0.65 + 0.2 * Math.sin(Date.now() * 0.008);
              ctx.beginPath();
              ctx.arc(0, 0, this.radius + 12, 0, Math.PI * 2);
              ctx.stroke();
            }

            ctx.restore();
          }
        }

        const player = new Player();

        // ==========================================
        // 7. ENEMY CRAFTS & PATTERNS
        // ==========================================
        class Enemy {
          constructor(type, x, y) {
            this.type = type; // 'SCOUT', 'CRUISER', 'INTERCEPTOR'
            this.x = x;
            this.y = y;
            this.time = Math.random() * 10;
            this.shootCooldown = Math.random() * 2 + 1;

            if (type === 'SCOUT') {
              this.radius = 16;
              this.maxHealth = 1;
              this.health = 1;
              this.speed = 3.2;
              this.scoreVal = 10;
              this.color = '#ff007f';
            } else if (type === 'INTERCEPTOR') {
              this.radius = 20;
              this.maxHealth = 2;
              this.health = 2;
              this.speed = 2.4;
              this.scoreVal = 25;
              this.color = '#f59e0b';
            } else {
              // CRUISER
              this.radius = 26;
              this.maxHealth = 4 + Math.floor(wave * 0.8);
              this.health = this.maxHealth;
              this.speed = 1.4;
              this.scoreVal = 50;
              this.color = '#10b981';
            }
          }

          takeDamage(dmg) {
            this.health -= dmg;
            if (this.health <= 0) {
              this.destroy();
              return true;
            } else {
              SFX.playLaser(300, 150, 0.05, 'square');
              particles.push(new Particle(this.x, this.y, 0, 0, this.color, 12, 0.15, 'ring'));
              return false;
            }
          }

          destroy() {
            createExplosion(this.x, this.y, this.color, 24, 1.0);
            score += this.scoreVal;
            statsEnemiesDefeated++;
            floatingTexts.push(new FloatingText(`+${this.scoreVal}`, this.x, this.y, this.color));

            // Chance to drop powerup
            if (Math.random() < 0.14) {
              const types = ['WEAPON', 'SHIELD', 'HEALTH', 'BOMB', 'RAPID'];
              const chosen = types[Math.floor(Math.random() * types.length)];
              powerUps.push(new PowerUp(this.x, this.y, chosen));
            }
          }

          update(dt) {
            this.time += dt * 3;
            this.shootCooldown -= dt;

            if (this.type === 'SCOUT') {
              this.y += this.speed * 60 * dt;
              this.x += Math.sin(this.time) * 3.5;
            } else if (this.type === 'INTERCEPTOR') {
              this.y += this.speed * 60 * dt;
              this.x += Math.cos(this.time * 0.8) * 4.5;
              // Occasional aimed shot
              if (this.shootCooldown <= 0 && this.y < CANVAS_HEIGHT * 0.7) {
                this.shootCooldown = 2.4;
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                const spd = 4.5;
                bullets.push(new Bullet(this.x, this.y + 15, Math.cos(angle) * spd, Math.sin(angle) * spd, '#f59e0b', 4, true));
                SFX.playEnemyLaser();
              }
            } else {
              // CRUISER
              this.y += this.speed * 60 * dt;
              if (this.shootCooldown <= 0 && this.y < CANVAS_HEIGHT * 0.75) {
                this.shootCooldown = 2.0;
                bullets.push(new Bullet(this.x - 12, this.y + 20, 0, 5, '#10b981', 4.5, true));
                bullets.push(new Bullet(this.x + 12, this.y + 20, 0, 5, '#10b981', 4.5, true));
                SFX.playEnemyLaser();
              }
            }

            return this.y <= CANVAS_HEIGHT + 40;
          }

          draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.shadowBlur = 12;
            ctx.shadowColor = this.color;
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.fillStyle = '#0f172a';

            if (this.type === 'SCOUT') {
              // Neon Magenta Dart
              ctx.beginPath();
              ctx.moveTo(0, 18);
              ctx.lineTo(15, -14);
              ctx.lineTo(0, -6);
              ctx.lineTo(-15, -14);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = '#ff007f';
              ctx.beginPath();
              ctx.arc(0, 2, 4, 0, Math.PI * 2);
              ctx.fill();
            } else if (this.type === 'INTERCEPTOR') {
              // Neon Orange Stealth Wing
              ctx.beginPath();
              ctx.moveTo(0, 20);
              ctx.lineTo(20, -10);
              ctx.lineTo(14, -18);
              ctx.lineTo(0, -10);
              ctx.lineTo(-14, -18);
              ctx.lineTo(-20, -10);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = '#fbbf24';
              ctx.fillRect(-4, -4, 8, 8);
            } else {
              // Emerald Heavy Cruiser
              ctx.beginPath();
              ctx.moveTo(0, 24);
              ctx.lineTo(24, 6);
              ctx.lineTo(26, -18);
              ctx.lineTo(12, -22);
              ctx.lineTo(0, -14);
              ctx.lineTo(-12, -22);
              ctx.lineTo(-26, -18);
              ctx.lineTo(-24, 6);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();

              // Hull core
              ctx.fillStyle = '#34d399';
              ctx.beginPath();
              ctx.arc(0, 2, 6, 0, Math.PI * 2);
              ctx.fill();

              // Mini health bar above cruiser if damaged
              if (this.health < this.maxHealth) {
                const bw = 32;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(-bw/2, -28, bw, 4);
                ctx.fillStyle = '#10b981';
                ctx.fillRect(-bw/2, -28, bw * (this.health / this.maxHealth), 4);
              }
            }

            ctx.restore();
          }
        }

        const enemies = [];

        // ==========================================
        // 8. BOSS TITAN MOTHERSHIP
        // ==========================================
        class Boss {
          constructor() {
            this.x = CANVAS_WIDTH / 2;
            this.y = -100;
            this.targetY = 160;
            this.radius = 65;
            this.maxHealth = 80 + wave * 40;
            this.health = this.maxHealth;
            this.scoreVal = 500;
            this.state = 'ENTERING'; // 'ENTERING', 'BATTLE', 'DEFEATED'
            this.time = 0;
            this.phaseTimer = 0;
            this.attackPattern = 0;
            this.fireTimer = 0;
            this.defeatedTimer = 0;
            this.coreAngle = 0;
            SFX.playBossWarning();
          }

          takeDamage(dmg) {
            if (this.state !== 'BATTLE') return false;
            this.health -= dmg;
            SFX.playLaser(250, 100, 0.06, 'sawtooth');
            particles.push(new Particle(
              this.x + (Math.random() * 80 - 40),
              this.y + (Math.random() * 40 - 20),
              0, 0, '#ef4444', 18, 0.2, 'ring'
            ));

            if (this.health <= 0) {
              this.state = 'DEFEATED';
              this.defeatedTimer = 2.5;
              score += this.scoreVal;
              floatingTexts.push(new FloatingText(`BOSS DESTROYED! +${this.scoreVal}`, this.x, this.y, '#ffbe0b'));
              // Drop multiple powerups
              powerUps.push(new PowerUp(this.x - 40, this.y, 'WEAPON'));
              powerUps.push(new PowerUp(this.x + 40, this.y, 'SHIELD'));
              powerUps.push(new PowerUp(this.x, this.y + 30, 'BOMB'));
              return true;
            }
            return false;
          }

          update(dt) {
            this.time += dt;
            this.coreAngle += dt * 2;

            if (this.state === 'ENTERING') {
              this.y += 1.8 * 60 * dt;
              if (this.y >= this.targetY) {
                this.y = this.targetY;
                this.state = 'BATTLE';
                floatingTexts.push(new FloatingText('TITAN ENGAGED', this.x, this.y + 80, '#ef4444'));
              }
              return true;
            }

            if (this.state === 'DEFEATED') {
              this.defeatedTimer -= dt;
              screenShake = Math.max(screenShake, 8);

              // Continuous chain explosions
              if (Math.random() < 0.4) {
                createExplosion(
                  this.x + (Math.random() * 120 - 60),
                  this.y + (Math.random() * 80 - 40),
                  Math.random() > 0.5 ? '#ef4444' : '#ffbe0b',
                  20,
                  1.2
                );
              }

              if (this.defeatedTimer <= 0) {
                createExplosion(this.x, this.y, '#ffffff', 60, 3.0);
                boss = null;
                bossActive = false;
                bossSpawnScore = score + 500;
                wave++;
                floatingTexts.push(new FloatingText(`WAVE ${wave} COMMENCING`, CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, '#00f0ff'));
                return false;
              }
              return true;
            }

            // Normal Battle Movement (side to side swoop)
            this.x = CANVAS_WIDTH / 2 + Math.sin(this.time * 0.8) * (CANVAS_WIDTH * 0.35);
            this.y = this.targetY + Math.cos(this.time * 1.5) * 25;

            // Attack cycle
            this.fireTimer -= dt;
            if (this.fireTimer <= 0) {
              this.attackPattern = (this.attackPattern + 1) % 3;

              if (this.attackPattern === 0) {
                // 5-way spread cannon
                this.fireTimer = 1.4;
                for (let i = -2; i <= 2; i++) {
                  const angle = Math.PI / 2 + i * 0.22;
                  const spd = 4.2;
                  bullets.push(new Bullet(this.x, this.y + 40, Math.cos(angle) * spd, Math.sin(angle) * spd, '#ef4444', 5, true));
                }
                SFX.playEnemyLaser();
              } else if (this.attackPattern === 1) {
                // Dual wing beam bursts aimed at player
                this.fireTimer = 0.9;
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                bullets.push(new Bullet(this.x - 45, this.y + 20, Math.cos(angle) * 5.5, Math.sin(angle) * 5.5, '#f59e0b', 4.5, true));
                bullets.push(new Bullet(this.x + 45, this.y + 20, Math.cos(angle) * 5.5, Math.sin(angle) * 5.5, '#f59e0b', 4.5, true));
                SFX.playEnemyLaser();
              } else {
                // Rapid burst stream
                this.fireTimer = 2.0;
                for (let k = 0; k < 6; k++) {
                  setTimeout(() => {
                    if (boss && boss.state === 'BATTLE') {
                      bullets.push(new Bullet(boss.x + (k % 2 === 0 ? -25 : 25), boss.y + 35, (Math.random() - 0.5) * 2, 6, '#ec4899', 4, true));
                      SFX.playLaser(380, 180, 0.08, 'square');
                    }
                  }, k * 120);
                }
              }
            }

            return true;
          }

          draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Glowing engine thrusters
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ef4444';
            ctx.fillRect(-55, -45, 14, 10);
            ctx.fillRect(41, -45, 14, 10);

            // Mothership Hull
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.fillStyle = '#111827';
            ctx.beginPath();
            ctx.moveTo(0, 48);
            ctx.lineTo(40, 30);
            ctx.lineTo(75, 10);
            ctx.lineTo(65, -35);
            ctx.lineTo(25, -45);
            ctx.lineTo(0, -35);
            ctx.lineTo(-25, -45);
            ctx.lineTo(-65, -35);
            ctx.lineTo(-75, 10);
            ctx.lineTo(-40, 30);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Wing Cannon turrets
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(-52, 10, 8, 22);
            ctx.fillRect(44, 10, 8, 22);

            // Rotating Plasma Core
            ctx.save();
            ctx.rotate(this.coreAngle);
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2.5;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fbbf24';
            ctx.strokeRect(-14, -14, 28, 28);
            ctx.restore();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Top Boss Health Bar
            const barW = 340;
            const barH = 14;
            const barX = (CANVAS_WIDTH - barW) / 2;
            const barY = 46;

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ef4444';
            ctx.strokeRect(barX, barY, barW, barH);
            ctx.fillRect(barX, barY, barW, barH);

            const pct = Math.max(0, this.health / this.maxHealth);
            const grad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
            grad.addColorStop(0, '#f59e0b');
            grad.addColorStop(1, '#ef4444');
            ctx.fillStyle = grad;
            ctx.fillRect(barX + 2, barY + 2, (barW - 4) * pct, barH - 4);

            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(`TITAN MOTHERSHIP [${Math.ceil(this.health)} / ${this.maxHealth}]`, CANVAS_WIDTH / 2, barY - 6);
            ctx.restore();
          }
        }

        let boss = null;

        // ==========================================
        // 9. SPAWNING ENGINE & COLLISION LOGIC
        // ==========================================
        let enemySpawnTimer = 0;

        function spawnEnemyWave(dt) {
          if (bossActive) return;

          // Check if boss should spawn
          if (score >= bossSpawnScore && !boss) {
            bossActive = true;
            boss = new Boss();
            bossWarningTimer = 2.5;
            return;
          }

          enemySpawnTimer -= dt;
          if (enemySpawnTimer <= 0) {
            const interval = Math.max(0.65, 1.8 - wave * 0.12);
            enemySpawnTimer = interval;

            const r = Math.random();
            let type = 'SCOUT';
            if (r > 0.75) type = 'CRUISER';
            else if (r > 0.4) type = 'INTERCEPTOR';

            const spawnX = Math.random() * (CANVAS_WIDTH - 120) + 60;
            enemies.push(new Enemy(type, spawnX, -30));
          }
        }

        function checkCollisions() {
          // 1. Player Lasers vs Enemies
          for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            if (b.isEnemy) continue;

            // Check Boss hit
            if (boss && boss.state === 'BATTLE') {
              const dist = Math.hypot(b.x - boss.x, b.y - boss.y);
              if (dist < boss.radius + b.radius) {
                boss.takeDamage(b.damage);
                bullets.splice(i, 1);
                continue;
              }
            }

            // Check standard enemies
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              const dist = Math.hypot(b.x - e.x, b.y - e.y);
              if (dist < e.radius + b.radius) {
                bullets.splice(i, 1);
                if (e.takeDamage(b.damage)) {
                  enemies.splice(j, 1);
                }
                break;
              }
            }
          }

          // 2. Enemy Lasers vs Player
          for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            if (!b.isEnemy) continue;

            const dist = Math.hypot(b.x - player.x, b.y - player.y);
            if (dist < player.radius + b.radius) {
              player.takeDamage(15);
              bullets.splice(i, 1);
            }
          }

          // 3. Enemy Ship vs Player Ship (Ramming)
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const dist = Math.hypot(e.x - player.x, e.y - player.y);
            if (dist < e.radius + player.radius) {
              player.takeDamage(25);
              e.destroy();
              enemies.splice(j, 1);
            }
          }

          // 4. Boss vs Player Ship
          if (boss && boss.state === 'BATTLE') {
            const dist = Math.hypot(boss.x - player.x, boss.y - player.y);
            if (dist < boss.radius + player.radius) {
              player.takeDamage(35);
            }
          }

          // 5. Player vs PowerUps
          for (let i = powerUps.length - 1; i >= 0; i--) {
            const p = powerUps[i];
            const dist = Math.hypot(p.x - player.x, p.y - player.y);
            if (dist < player.radius + p.radius) {
              SFX.playPowerup();
              if (p.type === 'WEAPON') {
                player.weaponLevel = Math.min(3, player.weaponLevel + 1);
                floatingTexts.push(new FloatingText('WEAPONS UPGRADE!', player.x, player.y - 30, '#00f0ff'));
              } else if (p.type === 'SHIELD') {
                player.shield = player.maxShield;
                floatingTexts.push(new FloatingText('SHIELDS FULL!', player.x, player.y - 30, '#38bdf8'));
              } else if (p.type === 'HEALTH') {
                player.health = Math.min(player.maxHealth, player.health + 35);
                floatingTexts.push(new FloatingText('+35 HP REPAIRED', player.x, player.y - 30, '#34d399'));
              } else if (p.type === 'BOMB') {
                player.bombs = Math.min(5, player.bombs + 1);
                floatingTexts.push(new FloatingText('+1 NOVA BOMB', player.x, player.y - 30, '#f59e0b'));
              } else if (p.type === 'RAPID') {
                player.rapidFireTimer = 8.0;
                floatingTexts.push(new FloatingText('HYPER OVERCHARGE!', player.x, player.y - 30, '#ec4899'));
              }
              powerUps.splice(i, 1);
            }
          }
        }

        // ==========================================
        // 10. HUD & USER INTERFACE DRAWING
        // ==========================================
        function drawHUD(ctx) {
          ctx.save();

          // Top HUD panel backdrop
          ctx.fillStyle = 'rgba(2, 6, 23, 0.7)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, 42);
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, 42);
          ctx.lineTo(CANVAS_WIDTH, 42);
          ctx.stroke();

          // Score & High Score
          ctx.font = 'bold 16px "Courier New", monospace';
          ctx.fillStyle = '#00f0ff';
          ctx.shadowBlur = 8;
          ctx.shadowColor = '#00f0ff';
          ctx.textAlign = 'left';
          ctx.fillText(`SCORE: ${score.toString().padStart(6, '0')}`, 20, 26);

          ctx.fillStyle = '#9ca3af';
          ctx.shadowBlur = 0;
          ctx.fillText(`HI: ${Math.max(score, highScore).toString().padStart(6, '0')}`, 220, 26);

          // Wave
          ctx.fillStyle = '#f59e0b';
          ctx.textAlign = 'center';
          ctx.fillText(`WAVE ${wave}`, CANVAS_WIDTH / 2, 26);

          // Lives (Mini Ship Icons)
          ctx.textAlign = 'right';
          ctx.fillStyle = '#00f0ff';
          ctx.fillText('LIVES:', CANVAS_WIDTH - 110, 26);
          for (let i = 0; i < player.lives; i++) {
            ctx.save();
            ctx.translate(CANVAS_WIDTH - 85 + i * 22, 22);
            ctx.strokeStyle = '#00f0ff';
            ctx.fillStyle = '#09152b';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(6, 6);
            ctx.lineTo(0, 3);
            ctx.lineTo(-6, 6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          // Bottom HUD: Health & Shield Bar + Bombs
          const barY = CANVAS_HEIGHT - 22;
          const barW = 160;

          // HP label & bar
          ctx.textAlign = 'left';
          ctx.font = 'bold 12px "Courier New", monospace';
          ctx.fillStyle = '#ef4444';
          ctx.fillText('HULL:', 20, barY + 10);

          ctx.strokeStyle = '#ef4444';
          ctx.strokeRect(60, barY, barW, 12);
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(60, barY, barW, 12);
          const hpPct = Math.max(0, player.health / player.maxHealth);
          ctx.fillStyle = hpPct > 0.3 ? '#ef4444' : (Math.floor(Date.now() / 150) % 2 === 0 ? '#ff0000' : '#7f1d1d');
          ctx.fillRect(62, barY + 2, (barW - 4) * hpPct, 8);

          // Shield bar if shield > 0
          if (player.shield > 0) {
            ctx.fillStyle = '#38bdf8';
            ctx.fillText('SHIELD:', 235, barY + 10);
            ctx.strokeStyle = '#38bdf8';
            ctx.strokeRect(290, barY, 100, 12);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(292, barY + 2, 96 * (player.shield / player.maxShield), 8);
          }

          // Bombs Available
          ctx.fillStyle = '#ffbe0b';
          ctx.fillText(`BOMBS [B]: ${player.bombs}`, CANVAS_WIDTH - 150, barY + 10);

          // Boss warning siren banner
          if (bossWarningTimer > 0) {
            ctx.save();
            ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
            ctx.fillRect(0, CANVAS_HEIGHT * 0.35, CANVAS_WIDTH, 60);
            ctx.font = 'bold 26px "Courier New", monospace';
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 18;
            ctx.shadowColor = '#ef4444';
            ctx.textAlign = 'center';
            if (Math.floor(Date.now() / 200) % 2 === 0) {
              ctx.fillText('⚠ WARNING: TITAN BOSS APPROACHING ⚠', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.35 + 40);
            }
            ctx.restore();
          }

          ctx.restore();
        }

        // ==========================================
        // 11. MENUS: TITLE & GAME OVER SCREENS
        // ==========================================
        function drawTitleScreen(ctx) {
          ctx.save();

          // Animated glowing title logo
          const glow = 15 + Math.sin(Date.now() * 0.004) * 8;
          ctx.shadowBlur = glow;
          ctx.shadowColor = '#00f0ff';
          ctx.textAlign = 'center';

          ctx.font = '900 52px "Courier New", monospace';
          ctx.fillStyle = '#00f0ff';
          ctx.fillText('NOVA STRIKE', CANVAS_WIDTH / 2, 230);

          ctx.font = 'bold 18px "Courier New", monospace';
          ctx.fillStyle = '#f59e0b';
          ctx.shadowColor = '#f59e0b';
          ctx.fillText('RETRO 2D VECTOR SPACE SHOOTER', CANVAS_WIDTH / 2, 275);

          // Ship Preview graphic
          ctx.save();
          ctx.translate(CANVAS_WIDTH / 2, 380);
          ctx.scale(2.2, 2.2);
          player.draw(ctx);
          ctx.restore();

          // Instructions Card
          const cardX = CANVAS_WIDTH / 2 - 240;
          const cardY = 490;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
          ctx.lineWidth = 2;
          ctx.strokeRect(cardX, cardY, 480, 220);
          ctx.fillRect(cardX, cardY, 480, 220);

          ctx.font = 'bold 18px "Courier New", monospace';
          ctx.fillStyle = '#00f0ff';
          ctx.fillText('MISSION CONTROLS', CANVAS_WIDTH / 2, cardY + 36);

          ctx.font = '15px "Courier New", monospace';
          ctx.fillStyle = '#e2e8f0';
          ctx.textAlign = 'left';
          ctx.fillText('• MOVE: Arrow Keys or W / A / S / D or Drag', cardX + 30, cardY + 75);
          ctx.fillText('• SHOOT: Spacebar or Left Mouse Click', cardX + 30, cardY + 105);
          ctx.fillText('• NOVA BOMB: B or X Key (Clears Bullets)', cardX + 30, cardY + 135);
          ctx.fillText('• PAUSE: P Key or Top Button', cardX + 30, cardY + 165);
          ctx.fillText('• TITAN BOSS: Spawns every 500 Points', cardX + 30, cardY + 195);

          // Start Button / Prompt
          ctx.textAlign = 'center';
          const btnPulse = Math.floor(Date.now() / 350) % 2 === 0;
          ctx.font = 'bold 24px "Courier New", monospace';
          ctx.fillStyle = btnPulse ? '#38bdf8' : '#ffffff';
          ctx.shadowBlur = 14;
          ctx.shadowColor = '#00f0ff';
          ctx.fillText('PRESS SPACE OR CLICK TO LAUNCH', CANVAS_WIDTH / 2, 770);

          // High score note
          ctx.font = '14px "Courier New", monospace';
          ctx.fillStyle = '#9ca3af';
          ctx.shadowBlur = 0;
          ctx.fillText(`ALL-TIME HIGH SCORE: ${highScore}`, CANVAS_WIDTH / 2, 825);

          ctx.restore();
        }

        function drawPauseScreen(ctx) {
          ctx.save();
          ctx.fillStyle = 'rgba(3, 7, 18, 0.75)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

          ctx.font = 'bold 44px "Courier New", monospace';
          ctx.fillStyle = '#00f0ff';
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#00f0ff';
          ctx.textAlign = 'center';
          ctx.fillText('SYSTEM PAUSED', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 40);

          ctx.font = '20px "Courier New", monospace';
          ctx.fillStyle = '#f3f4f6';
          ctx.shadowBlur = 0;
          ctx.fillText('Press P or Space to Resume Mission', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 25);
          ctx.restore();
        }

        function drawGameOverScreen(ctx) {
          ctx.save();
          ctx.fillStyle = 'rgba(3, 7, 18, 0.88)';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

          ctx.font = '900 52px "Courier New", monospace';
          ctx.fillStyle = '#ef4444';
          ctx.shadowBlur = 24;
          ctx.shadowColor = '#ef4444';
          ctx.textAlign = 'center';
          ctx.fillText('MISSION FAILED', CANVAS_WIDTH / 2, 260);

          ctx.font = 'bold 18px "Courier New", monospace';
          ctx.fillStyle = '#9ca3af';
          ctx.shadowBlur = 0;
          ctx.fillText('FLEET COMMAND LOST CONTACT WITH CRAFT', CANVAS_WIDTH / 2, 305);

          // Stats Box
          const boxX = CANVAS_WIDTH / 2 - 200;
          const boxY = 360;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
          ctx.lineWidth = 2;
          ctx.strokeRect(boxX, boxY, 400, 220);
          ctx.fillRect(boxX, boxY, 400, 220);

          ctx.font = 'bold 22px "Courier New", monospace';
          ctx.fillStyle = '#00f0ff';
          ctx.fillText(`FINAL SCORE: ${score}`, CANVAS_WIDTH / 2, boxY + 50);

          if (score >= highScore && score > 0) {
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillStyle = '#ffbe0b';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffbe0b';
            ctx.fillText('★ NEW HIGH SCORE RECORD! ★', CANVAS_WIDTH / 2, boxY + 85);
          } else {
            ctx.font = '16px "Courier New", monospace';
            ctx.fillStyle = '#9ca3af';
            ctx.shadowBlur = 0;
            ctx.fillText(`RECORD HIGH SCORE: ${highScore}`, CANVAS_WIDTH / 2, boxY + 85);
          }

          ctx.font = '16px "Courier New", monospace';
          ctx.fillStyle = '#e2e8f0';
          ctx.fillText(`SECTOR WAVE REACHED: ${wave}`, CANVAS_WIDTH / 2, boxY + 130);
          ctx.fillText(`ALIEN INVADERS DESTROYED: ${statsEnemiesDefeated}`, CANVAS_WIDTH / 2, boxY + 165);

          // Restart Prompt
          const blink = Math.floor(Date.now() / 350) % 2 === 0;
          ctx.font = 'bold 22px "Courier New", monospace';
          ctx.fillStyle = blink ? '#00f0ff' : '#ffffff';
          ctx.shadowBlur = 12;
          ctx.shadowColor = '#00f0ff';
          ctx.fillText('PRESS SPACE OR CLICK TO RESTART', CANVAS_WIDTH / 2, 660);

          ctx.restore();
        }

        // ==========================================
        // 12. GAME LOOP & STATE TRANSITIONS
        // ==========================================
        function startGame() {
          initAudio();
          score = 0;
          wave = 1;
          bossActive = false;
          boss = null;
          bossSpawnScore = 500;
          statsEnemiesDefeated = 0;
          bullets.length = 0;
          enemies.length = 0;
          powerUps.length = 0;
          particles.length = 0;
          floatingTexts.length = 0;
          player.reset();
          gameState = 'PLAYING';
          floatingTexts.push(new FloatingText('ZONE CLEARED - COMMENCE DEFENSE', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, '#00f0ff'));
        }

        function gameOver() {
          gameState = 'GAMEOVER';
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('nova_strike_high_score', highScore.toString());
          }
        }

        function togglePause() {
          if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            pauseBtn.innerText = 'RESUME';
          } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            pauseBtn.innerText = 'PAUSE (P)';
            lastTime = performance.now();
          }
        }

        pauseBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePause();
        });

        // ==========================================
        // 13. USER INPUT HANDLERS
        // ==========================================
        window.addEventListener('keydown', (e) => {
          initAudio();

          if (e.code === 'KeyP' || e.code === 'Escape') {
            togglePause();
            return;
          }

          if (gameState === 'TITLE' || gameState === 'GAMEOVER') {
            if (e.code === 'Space' || e.code === 'Enter') {
              startGame();
              return;
            }
          }

          if (gameState === 'PAUSED' && e.code === 'Space') {
            togglePause();
            return;
          }

          if (e.code in keys) {
            keys[e.code] = true;
          }
          if (e.key in keys) {
            keys[e.key] = true;
          }

          // Nova Bomb trigger
          if ((e.code === 'KeyB' || e.code === 'KeyX') && gameState === 'PLAYING') {
            player.useBomb();
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.code in keys) {
            keys[e.code] = false;
          }
          if (e.key in keys) {
            keys[e.key] = false;
          }
        });

        // Canvas coordinate converter
        function getCanvasPos(evt) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = CANVAS_WIDTH / rect.width;
          const scaleY = CANVAS_HEIGHT / rect.height;
          return {
            x: (evt.clientX - rect.left) * scaleX,
            y: (evt.clientY - rect.top) * scaleY
          };
        }

        canvas.addEventListener('pointerdown', (e) => {
          initAudio();
          if (gameState === 'TITLE' || gameState === 'GAMEOVER') {
            startGame();
            return;
          }
          if (gameState === 'PAUSED') {
            togglePause();
            return;
          }
          const pos = getCanvasPos(e);
          pointer.x = pos.x;
          pointer.y = pos.y;
          pointer.isDown = true;
          pointer.active = true;
        });

        window.addEventListener('pointermove', (e) => {
          if (pointer.isDown || pointer.active) {
            const pos = getCanvasPos(e);
            pointer.x = Math.max(20, Math.min(CANVAS_WIDTH - 20, pos.x));
            pointer.y = Math.max(30, Math.min(CANVAS_HEIGHT - 20, pos.y));
          }
        });

        window.addEventListener('pointerup', () => {
          pointer.isDown = false;
        });

        // Mobile on-screen button hooks
        mobileFireBtn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          initAudio();
          if (gameState === 'TITLE' || gameState === 'GAMEOVER') {
            startGame();
          } else {
            keys.Space = true;
          }
        });
        mobileFireBtn.addEventListener('pointerup', () => {
          keys.Space = false;
        });

        mobileBombBtn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          initAudio();
          if (gameState === 'PLAYING') {
            player.useBomb();
          }
        });

        // ==========================================
        // 14. MAIN ANIMATION LOOP
        // ==========================================
        function gameLoop(currentTime) {
          const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
          lastTime = currentTime;

          // Clear Canvas
          ctx.save();
          ctx.fillStyle = '#02040a';
          ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

          // Screen shake translation
          if (screenShake > 0) {
            const shakeX = (Math.random() * 2 - 1) * screenShake;
            const shakeY = (Math.random() * 2 - 1) * screenShake;
            ctx.translate(shakeX, shakeY);
            screenShake = Math.max(0, screenShake - dt * 25);
          }

          // Background Starfield
          starfield.update(dt);
          starfield.draw(ctx);

          if (gameState === 'PLAYING') {
            if (bossWarningTimer > 0) bossWarningTimer -= dt;

            // Spawning
            spawnEnemyWave(dt);

            // Update & Draw Player
            player.update(dt);
            player.draw(ctx);

            // Update & Draw Boss
            if (boss) {
              boss.update(dt);
              boss.draw(ctx);
            }

            // Update & Draw Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
              const e = enemies[i];
              if (!e.update(dt)) {
                enemies.splice(i, 1);
              } else {
                e.draw(ctx);
              }
            }

            // Update & Draw Projectiles
            for (let i = bullets.length - 1; i >= 0; i--) {
              const b = bullets[i];
              if (!b.update(dt)) {
                bullets.splice(i, 1);
              } else {
                b.draw(ctx);
              }
            }

            // Update & Draw PowerUps
            for (let i = powerUps.length - 1; i >= 0; i--) {
              const p = powerUps[i];
              if (!p.update(dt)) {
                powerUps.splice(i, 1);
              } else {
                p.draw(ctx);
              }
            }

            // Collisions
            checkCollisions();

            // HUD
            drawHUD(ctx);
          } else if (gameState === 'TITLE') {
            drawTitleScreen(ctx);
          } else if (gameState === 'PAUSED') {
            player.draw(ctx);
            for (let e of enemies) e.draw(ctx);
            if (boss) boss.draw(ctx);
            drawHUD(ctx);
            drawPauseScreen(ctx);
          } else if (gameState === 'GAMEOVER') {
            drawGameOverScreen(ctx);
          }

          // Update & Draw Particles (active in all states for explosion dissipation)
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            if (!p.update(dt)) {
              particles.splice(i, 1);
            } else {
              p.draw(ctx);
            }
          }

          // Update & Draw Floating Score Texts
          for (let i = floatingTexts.length - 1; i >= 0; i--) {
            const ft = floatingTexts[i];
            if (!ft.update(dt)) {
              floatingTexts.splice(i, 1);
            } else {
              ft.draw(ctx);
            }
          }

          ctx.restore();
          requestAnimationFrame(gameLoop);
        }

        // Launch Game Loop
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      });
    </script>
  </body>
</html>
